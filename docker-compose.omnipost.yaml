services:
  postgres:
    image: postgres:17-alpine
    container_name: omnipost-postgres
    environment:
      POSTGRES_DB: omnipost
      POSTGRES_USER: omnipost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnipost_secure_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnipost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnipost-net

  redis:
    image: redis:7.2-alpine
    container_name: omnipost-redis
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnipost-net

  temporal:
    image: temporalio/auto-setup:latest
    container_name: omnipost-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: omnipost
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-omnipost_secure_2026}
      POSTGRES_SEEDS: postgres
    ports:
      - '127.0.0.1:7233:7233'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnipost-net

  app:
    build:
      context: .
      dockerfile: Dockerfile.omnipost
    image: omnipost-app:latest
    container_name: omnipost-app
    env_file: .env
    ports:
      - '4200:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/opt/omnipost/uploads
    networks:
      - omnipost-net

  playwright:
    build:
      context: ./docker/playwright
      dockerfile: Dockerfile
    container_name: omnipost-playwright
    volumes:
      - playwright-contexts:/data/browser-contexts
    ports:
      - '127.0.0.1:3500:3500'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3500']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - omnipost-net

volumes:
  postgres-data:
  redis-data:
  uploads:
  playwright-contexts:

networks:
  omnipost-net:
    driver: bridge
